[project]
name = "bead-python"
version = "1.0.1"
description = "Bead tracking and magnetic-actuation experiment scripts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "EasyMCP2221>=1.8",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.2",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F"]
