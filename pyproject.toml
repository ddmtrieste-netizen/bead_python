[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "beadtrack"
version = "3.0.0"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyserial>=3.5",
    "scipy>=1.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]
